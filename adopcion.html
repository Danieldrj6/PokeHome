    <!-- necesita sueldo minimo, residencia, experiencia con certificado,
    certificado de entrenador pokemon, pokemon a solicitar, nombre completo, edad, email, celular, motivo -->
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-8 col-lg-8">
    <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
        <div class="card-body">
          <h3 class="card-title text-center fw-bold mb-4">Solicitar Pokemon</h3>
            <form class="row g-3">
        <div class="col-md-6">
            <label for="inputEmail4" class="form-label">Email</label>
            <input type="email" class="form-control" id="inputEmail4">
        </div>
        <div class="col-md-6">
            <label for="inputName" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="inputName2">
        </div>
        <div class="col-md-6">
            <label for="inputNumber" class="form-label">Telefono</label>
            <input type="number" class="form-control" id="inputNumber">
        </div>
        <div class="col-md-6">
            <label for="inputSueldo" class="form-label">Sueldo</label>
            <input type="number" class="form-control" id="inputSueldo">
        </div>
        <div class="col-12">
            <label for="inputAddress" class="form-label">Direccion</label>
            <input type="text" class="form-control" id="inputAddress" placeholder="1234 La Florida">
        </div>
        <div class="col-12">
            <label for="inputAddress2" class="form-label">Residencia</label>
            <input type="text" class="form-control" id="inputAddress2" placeholder="Departamento, Terreno, Casa">
        </div>
        <div class="col-md-6">
            <label for="inputCity" class="form-label">Ciudad</label>
            <input type="text" class="form-control" id="inputCity">
        </div>
        <div class="col-md-4">
            <label for="inputState" class="form-label">Comuna</label>
            <select id="inputState" class="form-select">
            <option selected>Seleccionar</option>
            <option>La Florida</option>
            <option>Las Condes</option>
            <option>Providencia</option>
            <option>Lo Barnechea</option>
            <option>San Bernardo</option>
            <option>Puente Alto</option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="inputZip" class="form-label fw-medium text-nowrap">Código Postal</label>
            <input type="text" class="form-control form-control-lg" id="inputZip">
        </div>
        <div class="col-12">
            <label for="inputMotivo" class="form-label">Motivo</label>
            <input type="text" class="form-control" id="inputMotivo" placeholder="Porque quiero este pokemon...">
        </div>
        <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Charmander
            </label>
            </div>
          </div>
        <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck2">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Froakie
            </label>
            </div>
          </div>
        <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck3">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Leafeon
            </label>
          </div>
          </div>
        <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck4">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Squirtle
            </label>
          </div>
          </div>
        <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck5">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Eevee
            </label>
          </div>
          </div>
        <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck6">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Cyndaquil
            </label>
          </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck7">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Gengar
            </label>
          </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck8">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Lucario
            </label>
          </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck9">
            <label class="form-label fw-medium d-block" for="gridCheck">
                Growlithe
            </label>
          </div>
          </div>
         <div class="col-12">
       <button type="submit" class="btn btn-primary">Solicitar</button>
      </div>
    </form>
